# Describes the format for available services for bmw_connected_drive
lock:
  description: >
    Lock all doors of the vehicle. The vehicle is identified via the vin
    (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001

unlock:
  description: >
    Unlock all doors of the vehicle. The vehicle is identified via the vin
    (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001

lights:
  description: >
    Flash the lights of the vehicle. The vehicle is identified via the vin
    (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001

horn:
  description: >
    Sound the horn of the vehicle. The vehicle is identified via the vin
    (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001

remote_start:
  description: >
    Start the engine and climate control of the vehicle.  Uses the climate control settings saved. The vehicle is identified via
    the vin (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001

remote_stop:
  description: >
    Stop the engine and climate control of the vehicle. The vehicle is identified via the vin
    (see below).
  fields:
    vin:
      description: >
        The vehicle identification number (VIN) of the vehicle, 17 characters
      example: JF2ABCDE6L0000001
